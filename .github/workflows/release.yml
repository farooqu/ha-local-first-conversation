name: Validate and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate and publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.2"
      - name: Validate version and changelog
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/release_notes.py "$RELEASE_TAG"
          else
            python scripts/release_notes.py
          fi
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Test
        run: python -m pytest -q
      - name: Lint and check formatting
        run: |
          ruff check custom_components tests scripts
          ruff format --check custom_components tests scripts

  release:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Extract release notes
        run: python scripts/release_notes.py "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${flags[@]}"
